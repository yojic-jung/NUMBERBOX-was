# JPA Properties
spring.jpa.database=mysql
spring.jpa.database-platform=org.hibernate.dialect.MySQL5InnoDBDialect
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# multipartresolver
spring.servlet.multipart.maxFileSize=15MB
spring.servlet.multipart.maxRequestSize=15MB
server.tomcat.max-http-form-post-size=15000000

#context-path setting
server.servlet.context-path=/myWasApi

# static resources path
spring.mvc.static-path-pattern=/webapp/**

#tmp aws-s3-set
numberbox.s3BucketUrl=https://numberbox-bucket.s3.ap-northeast-2.amazonaws.com/

cloud.aws.s3.bucket=${s3_bucket_name}
cloud.aws.credentials.accessKey=${aws_s3_access_key}
cloud.aws.credentials.secretKey=${aws_s3_secret_key}
cloud.aws.region.static=ap-northeast-2
cloud.aws.stack.auto=false
