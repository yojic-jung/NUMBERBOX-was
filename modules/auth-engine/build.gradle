plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.3'
    id 'io.spring.dependency-management' version '1.0.11.RELEASE'
    id 'org.jetbrains.kotlin.jvm'
    id 'java-test-fixtures'
}

group = 'com.numberbox'
version = '0.0.1-SNAPSHOT'

java {
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(":modules:auth-control")

    implementation libs.bundles.modules.auth.engine
    testImplementation libs.bundles.modules.auth.engine.test
    testFixturesImplementation libs.bundles.modules.auth.engine.test.fixture
}

// engine 모듈에서 control 모듈 테스트 커버리지까지 측정
tasks.jacocoTestReport {
    classDirectories.setFrom(
            files(
                    fileTree(dir: "${buildDir}/classes/java/main", includes: ['**/*.class']),
                    fileTree(dir: "${project(':modules:auth-control').buildDir}/classes/java/main", includes: ['**/*.class'])
            )
    )

    executionData.setFrom(
            file("${buildDir}/jacoco/test.exec"),
    )

    reports {
        xml.required = true
        html.required = true
    }
}


bootJar { enabled = false }
bootRun { enabled = false }

tasks.named('test') {
    useJUnitPlatform()
}

kotlin {
    jvmToolchain(17)
}
