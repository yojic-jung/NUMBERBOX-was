hwp:
  server:
    ip: ${local.hwp.server.ip}
    port: ${local.hwp.server.port}

spring:
  kafka:
    bootstrap-servers: 127.0.0.1:19092,127.0.0.1:19093,127.0.0.1:19094
    admin:
      auto-create: false
      properties:
        request.timeout.ms: 3000
    producer:
      acks: all
      retries: 2
      linger-ms: 1000
      batch-size: 16000
      buffer-memory: 33554432
      retry-backoff-ms: 1000
      request-timeout-ms: 2000
      delivery-timeout-ms: 8500
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  cloud:
    function:
      definition: jsonToHwpProduce; hwpToHtmlProduce; # Producer 함수 이름
    stream:
      kafka:
        binder:
          brokers: 127.0.0.1:19092,127.0.0.1:19093,127.0.0.1:19094
      bindings:
        jsonToHwpProduce-out-0: # 채널 이름 (함수이름-입력/출력-인덱스, 같은 함수로 여러 토픽 처리하고 싶은 경우 인덱스 구분)
          destination: numberbox.jsonToHwp.request  # Topic 이름
          content-type: application/json
          producer:
            partition-key-expression: payload.id # partition key 설정, 이 key 값에 대한 해시값으로 partition 나누어 저장됨
            partition-count: 3
        hwpToHtmlProduce-out-0:
          destination: numberbox.hwpToHtml.request
          content-type: application/json
          producer:
            partition-key-expression: payload.id # partition key 설정, 이 key 값에 대한 해시값으로 partition 나누어 저장됨
            partition-count: 3
