spring:
  config:
    activate:
      on-profile: orm-jpa-adapter-tc-test
  jpa:
    database: mysql
    open-in-view: false
    show-sql: true
    generate-ddl: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations:
      - classpath:/flyway/migration
      - classpath:/flyway/dummy

custom:
  test-container:
    enabled: true
  redis:
    port: 6380