spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/numberbox_tc?characterEncoding=utf8
    username: test
    password: 1111
  jpa:
    database: mysql
    open-in-view: false
    show-sql: true
    generate-ddl: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations:
      - classpath:/flyway/migration
      - classpath:/flyway/dummy
  test:
    database:
      replace: NONE