spring:
  kafka:
    admin:
      auto-create: false
    consumer:
      max-poll-records: 100
      properties:
        fetch.min.bytes: 5000
        fetch.max.bytes: 10485760
        max.partition.fetch.bytes: 1048576
        fetch.max.wait.ms: 1000   # 최대 1초까지 대기
        max.poll.interval.ms: 300000  # 최대 5분까지 poll 호출 지연 허용
  cloud:
    function:
      definition: jsonToHwpConsume; hwpToHtmlConsume; # Consumer 함수 이름
    stream:
      kafka:
        binder:
          brokers: 127.0.0.1:19092,127.0.0.1:19093,127.0.0.1:19094
          auto-create-topics: false
      bindings:
        jsonToHwpConsume-in-0:
          destination: hwpConverter.jsonToHwp.complete
          content-type: application/json
          group: hwpConvert-consumer
          consumer:
            max-attempts: 3
            back-off-initial-interval: 2000  # 최초 재요청 대기시간 2초
            back-off-multiplier: 2.0         # 재요청 할 때마다, back-off-initial-interval에 이 값을 곱해서 요청
            back-off-max-interval: 10000     # multiplier를 곱한 값이 max-interval을 넘어가면, max-interval 에서 재요청
            concurrency: 3
        hwpToHtmlConsume-in-0:
          destination: hwpConverter.hwpToHtml.complete
          content-type: application/json
          group: hwpConvert-consumer
          consumer:
            max-attempts: 3
            back-off-initial-interval: 2000  # 최초 재요청 대기시간 2초
            back-off-multiplier: 2.0         # 재요청 할 때마다, back-off-initial-interval에 이 값을 곱해서 요청
            back-off-max-interval: 10000     # multiplier를 곱한 값이 max-interval을 넘어가면, max-interval 에서 재요청
            concurrency: 3
