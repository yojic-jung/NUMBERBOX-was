spring:
  profiles:
    active: local
    group:
      local:
        - rest-api
        - orm-jpa-adapter
        - orm-jpa-adapter-local
        - orm-jpa-adapter-env
        - mail-sender-local
        - mail-sender-env
        - storage
        - storage-env
        - hwp-client-local
        - hwp-client-env
        - redis-local
        - redis-env

# s3 설정
cloud:
  aws:
    s3:
      bucket: numberbox-bucket
    credentials:
      accessKey: AKIA4SERHKUEFTRCTG7F
      secretKey: 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
    region:
      static: ap-northeast-2
    stack:
      auto: false

# DI 및 transaction 커스텀 어노테이션 경로
system:
  construction:
    di:
      class-path:
        customBean: com.kamcci.numberbox.app.domain.system.construction.UseCase
        basePackage: com.kamcci.numberbox.app
        beanScope: singleton
        primary: com.kamcci.numberbox.app.domain.system.construction.Priority
        qualifier: com.kamcci.numberbox.app.domain.system.construction.Aliases
    tx:
      class-path:
        transaction: com.kamcci.numberbox.app.domain.system.construction.TXExecute
kamcci:
  logging:
    request:
      content-type: application/json
      body-except-uri:
        - /member/phone
        - /public/member/findEmail
        - /public/member/signup
        - /member/password
        - /member/password-confirm

# actuator
management:
  endpoints:
    web:
      exposure:
        include: prometheus

  prometheus:
    metrics:
      export:
        enabled: true