global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: [ "localhost:9090" ]

  - job_name: "Application"
    metrics_path: '/myWasApi/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: [ '13.125.137.15:8080' ]

  - job_name: "mysql"
    static_configs:
      - targets: [ 'mysqld-exporter:9104' ]